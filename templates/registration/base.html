{% load static i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% translate "Древо" %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&display=swap">
  <link rel="stylesheet" href="{% static 'genealogy/auth.css' %}">
</head>
<body>
{% block main %}
<main class="auth">
  <p class="brand">{% translate "Древо" %}</p>
  <section class="auth-card">
    {% block content %}{% endblock %}
  </section>
  {% if not user.is_authenticated %}{% include "registration/_languages.html" %}{% endif %}
</main>
{% endblock %}
</body>
</html>
